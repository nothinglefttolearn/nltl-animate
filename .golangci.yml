version: "2"

run:
  timeout: 5m
  build-tags:
    - integration

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - gosec
    - misspell
    - nolintlint
    - perfsprint
    - revive
    - unconvert
    - unparam
    - usestdlibvars
  settings:
    gosec:
      excludes:
        - G204 # exec.Command with variable args is the whole point of internal/ffmpeg
        - G304 # reading a user-supplied --config path is intended
    revive:
      rules:
        - name: exported
          disabled: true # internal packages; doc comments not enforced yet
        - name: package-comments
          disabled: true

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/nothinglefttolearn/nltl-animate

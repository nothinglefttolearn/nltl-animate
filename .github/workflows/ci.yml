name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v3
        with:
          cache: true
      - uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/.cache/golangci-lint
          key: go-${{ runner.os }}-${{ hashFiles('go.sum', 'mise.toml') }}
          restore-keys: go-${{ runner.os }}-
      - run: mise run ci

  integration:
    # Renders a short clip of every style with a real ffmpeg (Ubuntu's is
    # 6.x; the grid style needs >= 5.1).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - uses: jdx/mise-action@v3
        with:
          install_args: go
          cache: true
      - run: mise run test:integration

  build:
    # Cross-compile check: the tool is used on macOS, so make sure it builds there too.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v3
        with:
          install_args: go
          cache: true
      - run: go build -trimpath ./cmd/nltl-animate/
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
